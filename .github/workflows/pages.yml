name: Validate and deploy Saha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build PWA icons
        run: python3 scripts/build_icons.py
      - name: Source integrity and syntax
        run: |
          node --check cases-data.js
          node --check app-core.js
          node --check sw.js
          node scripts/validate.mjs
          node scripts/ui-audit.mjs
          node scripts/design-audit.mjs
      - name: Install pinned browser test tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.65.1
          npx playwright install --with-deps chromium
      - name: Mobile and desktop browser tests
        env:
          SAHA_SCREENSHOTS: ${{ runner.temp }}/saha-screenshots
        run: node scripts/browser-smoke.mjs
      - name: Upload visual test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: saha-browser-screenshots
          path: ${{ runner.temp }}/saha-screenshots
          if-no-files-found: ignore
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static release
        run: |
          mkdir _site
          cp index.html saha-design.css cases-data.js app-core.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png apple-touch-icon.png .nojekyll _site/
      - name: Archive Pages release
        run: |
          tar --dereference --hard-dereference --directory _site -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './index.html'
      - name: Upload uniquely named Pages artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Confirm artifact is visible through REST
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 20); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$EXPECTED_ID" --jq '.name' | grep -Fx "$ARTIFACT_NAME" &&
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq ".artifacts | map(select(.name == \"$ARTIFACT_NAME\" and .expired == false)) | length" | grep -Fx 1; then
              echo "Verified unique artifact $EXPECTED_ID ($ARTIFACT_NAME)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Pages artifact not visible or not unique"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify live release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${PAGE_URL%/}/?release=$GITHUB_SHA-$attempt" | grep -F 'Saha112 — V3.0.1'; then
              echo "Live release confirmed: V3.0.1"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Live version could not be confirmed"
          exit 1
